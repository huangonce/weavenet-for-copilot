name: Rescue publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.7.12
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/publish-release.yml
    with:
      ref: refs/tags/${{ inputs.tag }}
    secrets: inherit
