name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Package extension
        run: npm run package -- --out weavenet-for-copilot.vsix

      - name: Inspect extension package contents
        run: npm run package:list

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary-${{ github.sha }}
          path: coverage/coverage-summary.json
          if-no-files-found: ignore

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: weavenet-for-copilot-${{ github.sha }}
          path: weavenet-for-copilot.vsix
          if-no-files-found: error

  host:
    name: Extension host smoke (${{ matrix.label }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exercise provider registration, requests and protocol replay on
          # both the declared engines.vscode floor and the latest stable host.
          - label: minimum-supported
            vscodeVersion: '1.116.0'
          - label: latest-stable
            vscodeVersion: ''

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download tested VSIX
        uses: actions/download-artifact@v4
        with:
          name: weavenet-for-copilot-${{ github.sha }}

      - name: Run installed VSIX regression
        env:
          VSCODE_VERSION: ${{ matrix.vscodeVersion }}
          VSCODE_TEST_VSIX: ${{ github.workspace }}/weavenet-for-copilot.vsix
        run: xvfb-run -a node test/integration/run.cjs
