name: Publish release package

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref containing the release package
        required: true
        type: string
    secrets:
      VSCE_PAT:
        required: true
      OVSX_PAT:
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: publish-${{ inputs.ref }}
      cancel-in-progress: false

    steps:
      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency supply chain
        run: npm audit --audit-level=high

      - name: Verify ref matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          REF_VERSION="${{ inputs.ref }}"
          REF_VERSION="${REF_VERSION#refs/tags/}"
          REF_VERSION="${REF_VERSION#v}"
          if [[ "$REF_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Release ref version $REF_VERSION does not match package.json version $PACKAGE_VERSION." >&2
            exit 1
          fi

      - name: Lint source
        run: npm run lint

      - name: Type-check source and tests
        run: npm run typecheck

      - name: Compile extension
        run: npm run compile

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run VS Code extension host smoke test
        run: xvfb-run -a npm run test:integration

      - name: Inspect extension package contents
        run: npm run package:list

      - name: Package VSIX
        id: package
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VSIX="weavenet-for-copilot-${VERSION}.vsix"
          npm run package -- --out "$VSIX"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"
          TAG="${{ inputs.ref }}"
          echo "tag=${TAG#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.vsix }}
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error

      - name: Publish to Visual Studio Marketplace
        run: npm exec -- vsce publish --packagePath "${{ steps.package.outputs.vsix }}" --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: ${{ secrets.OVSX_PAT != '' }}
        run: npm exec -- ovsx publish --skip-duplicate "${{ steps.package.outputs.vsix }}"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Attach VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          files: ${{ steps.package.outputs.vsix }}
          fail_on_unmatched_files: true
